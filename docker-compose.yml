services:
  mongo:
    image: mongo:7
    container_name: tasktodo-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend
    container_name: tasktodo-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/tasktodo
      JWT_SECRET: supersecret
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: tasktodo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: